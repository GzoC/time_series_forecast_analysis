[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "industrial-energy-forecast"
version = "0.1.0"
description = "Daily steel plant energy planning with chronological evaluation"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
dependencies = ["numpy>=2,<2.5", "pandas>=2.2,<3", "statsmodels>=0.14,<0.15", "prophet>=1.1,<2", "streamlit>=1.50,<2", "altair>=6,<7"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
energy-forecast = "energy_forecast.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
include = ["energy_forecast*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
