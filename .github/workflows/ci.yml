name: Energy forecast study
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forecast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync pytest
      - run: uv run --no-sync energy-forecast run
      - run: uv build
      - name: Wheel outside checkout
        run: |
          uv venv /tmp/energy-wheel
          uv pip install --python /tmp/energy-wheel/bin/python --require-hashes -r requirements.txt
          uv pip install --python /tmp/energy-wheel/bin/python --no-deps dist/*.whl
          cd /tmp
          /tmp/energy-wheel/bin/energy-forecast run --data "$GITHUB_WORKSPACE/data/raw/Steel_industry_data.csv" --output /tmp/energy-report
      - uses: actions/upload-artifact@v4
        with:
          name: energy-python-${{ matrix.python }}
          path: |
            reports/
            dist/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t energy-study .
      - name: Run dashboard and check health
        run: |
          docker run -d --name energy -p 127.0.0.1:8504:8504 energy-study
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8504/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs energy
          exit 1
